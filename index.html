/* Mobile archive cards: exactly two total lines per card - title 1 line, performer 1 line */
@media (max-width:720px){
  .grid{column-gap:9px;row-gap:20px;align-items:start}
  .tile{display:flex;flex-direction:column}
  .tile h3,.tile p{
    display:block;overflow:hidden;white-space:nowrap;text-overflow:clip;
    margin:0!important;padding:0!important
  }
  .tile h3{
    font-size:10px!important;line-height:1.2!important;font-weight:600!important;
    margin-top:6px!important;margin-bottom:1px!important;
    height:1.2em;max-height:1.2em
  }
  .tile p{
    font-size:9px!important;line-height:1.2!important;font-weight:400!important;
    color:#8e8a95!important;height:1.2em;max-height:1.2em
  }
}

/* Compact search in header; keep the same search behavior */
header input#search{width:240px;max-width:48%;min-width:0;height:34px;padding:6px 12px;border:1px solid #e8e5ed;border-radius:9px;font-size:12px;background:#fff;color:#65616d;flex-shrink:1}
header input#search::placeholder{color:#aaa5b3}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:720px){
 header{padding:12px 15px;gap:9px}
 header strong{font-size:15px;white-space:nowrap;flex:0 0 auto}
 header input#search{width:135px;max-width:43%;height:30px;font-size:11px;padding:5px 10px}
 main{padding-top:16px}
 .grid{row-gap:9px!important}
 .tile h3{margin-top:5px!important;margin-bottom:0!important}
 .tile p{margin-top:0!important}
}

/* Mobile detailed album redesign. Desktop archive layout remains unchanged. */
.mobile-composer,.mobile-meta,.mobile-tools,.mobile-player,#mobile-artist{display:none}
@media(max-width:720px){
 .dialog{
   height:min(91dvh,830px)!important;width:calc(100vw - 16px)!important;
   padding:48px 16px 20px!important;gap:0!important;
   display:flex!important;flex-direction:column!important;border-radius:18px!important;
 }
 .left{
   display:grid!important;grid-template-columns:minmax(0,40%) minmax(0,60%)!important;
   gap:13px!important;align-items:start!important;flex:0 0 auto!important;
   width:100%!important;padding:0 12px 0 0!important;
   margin-bottom:10px!important;min-width:0!important
 }
 .cover{width:100%!important;height:auto!important;aspect-ratio:1!important;object-fit:contain!important;align-self:start!important}
 .info{text-align:left!important;margin:0!important;min-width:0!important;display:flex!important;flex-direction:column!important;gap:4px!important}
 .info .mobile-composer{display:block;font-size:13px!important;line-height:1.3!important;color:#827c8b!important;font-weight:500!important;margin:0!important}
 .info h2{font-size:16px!important;line-height:1.27!important;font-weight:650!important;margin:0!important;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;overflow-wrap:anywhere}
 .info #artist{display:none!important}
 .info #mobile-artist{display:block!important;font-size:12.5px!important;line-height:1.35!important;margin:0!important;color:#8b8793!important;display:-webkit-box!important;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
 .mobile-meta{display:flex!important;flex-wrap:wrap;gap:3px 10px;margin-top:4px!important;font-size:11px;line-height:1.4;color:#98929e}
 .mobile-meta b{color:#817b8e;font-weight:500;margin-right:3px}
 .mobile-meta [hidden]{display:none!important}
 .mobile-tools{display:flex!important;gap:16px;align-items:center;font-size:20px;color:#aca1c2;margin-top:4px}
 .bottom{display:none!important}
 .mobile-player{
   display:flex!important;flex:0 0 56px!important;margin:4px 0 8px!important;
   border-bottom:1px solid #edeaf1;justify-content:space-between;align-items:center;
   font-size:23px;color:#aaa0c2;padding:0 7px;
 }
 .player-center{display:flex;align-items:center;gap:31px;font-size:27px;font-weight:300}
 .player-edge{font-size:19px}
 .right{border-top:0!important;padding:4px 3px 0!important;flex:1!important;min-height:0!important}
 .track{font-size:13px!important;min-height:49px!important;padding:10px 0!important;line-height:1.38!important}
 .close{top:10px!important;right:10px!important}
}

/* iPhone detail refinement: cover +10%, compact title and track rows. */
@media (max-width:720px){
 .dialog .left{grid-template-columns:minmax(0,44%) minmax(0,56%)!important;gap:11px!important;}
 .dialog .info h2{font-size:14.5px!important;line-height:1.24!important;}
 .dialog .track{min-height:42px!important;padding:7px 0!important;line-height:1.3!important;}
}

/* Mobile-only finishing touches: artwork heart, compact tracks, safe scrollbar gutter. */
.cover-wrap{width:min(100%,480px);position:relative;display:flex;justify-content:center}
.cover-wrap .cover{width:100%}
.cover-heart{display:none}
@media(max-width:720px){
 .dialog .cover-wrap{width:100%!important;position:relative!important;align-self:start!important}
 .dialog .cover-wrap .cover{width:100%!important;display:block!important}
 .dialog .cover-heart{display:flex!important;position:absolute;left:8px;bottom:8px;
   align-items:center;justify-content:center;color:#aaa0c2;line-height:0;pointer-events:none}
 .dialog .cover-heart svg{width:14px!important;height:14px!important}
 .dialog .mobile-tools{display:none!important}
 .dialog .right{overflow-y:auto!important;padding:3px 19px 0 3px!important;
   scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:rgba(160,153,179,.32) transparent}
 .dialog .right::-webkit-scrollbar{width:5px!important}
 .dialog .right::-webkit-scrollbar-thumb{background:rgba(160,153,179,.32)!important;border-radius:99px!important}
 .dialog .track{min-height:37px!important;padding:5px 0!important;
   grid-template-columns:24px minmax(0,1fr) 49px!important;column-gap:8px!important;
   line-height:1.26!important;font-weight:350!important}
 .dialog .track .dur{text-align:right!important;white-space:nowrap!important}
}
