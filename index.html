<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY MUSIC ATLAS — Preview</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Pretendard", "Helvetica Neue",Arial,sans-serif;color:#303039;background:#fff}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#fffffff2;backdrop-filter:blur(12px);border-bottom:1px solid #eeebf2;z-index:3;padding:18px max(22px,5vw);display:flex;align-items:center;justify-content:space-between;gap:15px}h1{font-size:19px;letter-spacing:.04em;margin:0}small,.muted{color:#9995a6}.tag{border:1px solid #e9e5ef;border-radius:100px;padding:7px 12px;font-size:11px;color:#938a9f}.wrap{max-width:1360px;margin:auto;padding:30px 5vw 80px}.intro{color:#8d8894;font-size:14px;margin-bottom:26px}.toolbar{display:flex;gap:15px;align-items:center;margin-bottom:22px}.toolbar input{border:1px solid #e8e4ed;border-radius:10px;padding:12px 15px;width:min(360px,100%);font:inherit;outline:none}.toolbar input:focus{border-color:#b9adc8}.count{font-size:12px;color:#9f9aaa}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:31px 22px}.album{cursor:pointer;border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit}.cover{aspect-ratio:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--bg);color:var(--fg);border:1px solid #e9e6e5;box-shadow:0 1px 5px #1c15200a}.cover:after{content:"";position:absolute;inset:11px;border:1px solid #ffffff7a}.cover .art{font:500 clamp(22px,3vw,39px)/1.13 Georgia,serif;text-align:center;letter-spacing:.06em;padding:19px}.cover .art span{display:block;font:400 11px/1.5 sans-serif;letter-spacing:.2em;margin-top:14px}.album-title{font-size:13px;line-height:1.45;font-weight:600;margin:10px 0 4px}.album-artist{font-size:12px;color:#9995a1}.album:hover .cover{box-shadow:0 8px 25px #211a2d17}#modal{position:fixed;inset:0;background:#17131d9c;z-index:5;display:none;padding:2vh 2vw;align-items:center;justify-content:center}#modal.open{display:flex}.panel{position:relative;background:#fff;border-radius:24px;width:min(1400px,100%);height:min(900px,95vh);display:grid;grid-template-columns:44% 56%;overflow:hidden}.close{position:absolute;right:15px;top:15px;border:0;border-radius:50%;background:#f6f4f8;color:#a69bb8;width:43px;height:43px;font-size:28px;font-weight:200;cursor:pointer;z-index:2}.left{padding:35px 32px 24px;display:flex;flex-direction:column;align-items:center;min-height:0}.modal-cover{height:min(47vh,460px);max-width:100%;aspect-ratio:1}.modal-cover .art{font-size:clamp(27px,3.5vw,52px)}.headline{text-align:center;margin:19px 0 4px;font-size:clamp(18px,2.1vw,26px);line-height:1.28}.sub{text-align:center;color:#92909a;font-size:13px}.spacer{flex:1;min-height:12px}.seek{width:100%;height:5px;background:#e6e2ec;border-radius:20px;margin-bottom:10px}.time{font-size:11px;color:#a9a0b7;align-self:stretch}.transport{display:flex;width:100%;justify-content:space-between;align-items:center;color:#b6acc9;margin:18px 0 13px}.transport .mid{display:flex;gap:36px;align-items:center}.transport svg,.bottom svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.transport .mid svg{width:25px;height:25px}.bottom{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:10px;gap:10px}.bottom .icons{display:flex;gap:22px;color:#b8aec9}.bottom .icons svg{width:19px;height:19px}.stats{display:flex;gap:20px;color:#9b96a5;font-size:12px;white-space:nowrap}.stats b{font-weight:500;color:#8a8494;margin-right:7px}.right{padding:55px 50px 45px 27px;min-height:0;overflow:hidden}.tracks{height:100%;overflow-y:auto;padding-right:10px;scrollbar-width:thin;scrollbar-color:#d9d2e0 transparent}.tracks::-webkit-scrollbar{width:8px}.tracks::-webkit-scrollbar-track{background:#e9e6ed35;border-radius:100px}.tracks::-webkit-scrollbar-thumb{background:#b9afc640;border-radius:100px}.track{display:grid;grid-template-columns:37px minmax(0,1fr) 48px;gap:15px;align-items:center;padding:17px 5px;border-bottom:1px solid #f0edf3;font-weight:350;font-size:13px;line-height:1.6;color:#9d9aa5}.track:last-child{border-bottom:0}.num,.duration{color:#ac9fc3}.duration{text-align:right}.notice{font-size:11px;color:#aaa2b5;margin:6px 0 0;text-align:center}@media(max-width:780px){header{padding:15px 18px}.tag{font-size:10px}.wrap{padding:22px 18px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:19px 10px}.album-title{font-size:11px}.album-artist{font-size:10px}.cover .art{font-size:16px;padding:7px}.cover .art span{font-size:8px;margin-top:8px}.panel{grid-template-columns:1fr;height:94dvh;overflow-y:auto;border-radius:18px}.left{padding:25px 28px 10px}.modal-cover{height:210px}.modal-cover .art{font-size:29px}.headline{font-size:18px;margin-top:12px}.spacer{min-height:15px}.bottom{margin-top:4px}.right{padding:15px 25px 30px;min-height:260px;overflow:visible}.tracks{overflow:visible}.track{font-size:12px;padding:12px 2px}.stats{gap:8px;font-size:10px}}
</style></head><body><header><h1>MY MUSIC ATLAS</h1><span class="tag">NAS MUSIC ARCHIVES · PREVIEW</span></header><main class="wrap"><div class="intro">앨범 탐색 화면 미리보기 · 샘플 음반만 포함되어 있습니다.</div><div class="toolbar"><input type="search" id="q" placeholder="Search albums, composers, performers"><span id="count" class="count"></span></div><div class="grid" id="grid"></div></main><div id="modal" role="dialog" aria-modal="true" aria-label="Album details"><div class="panel"><button class="close" id="close" aria-label="Close">×</button><div class="left"><div id="modalCover" class="cover modal-cover"></div><h2 id="headline" class="headline"></h2><div id="performer" class="sub"></div><div class="spacer"></div><div class="seek"></div><div class="time">0:00 <span style="float:right">--:--</span></div><div class="transport"><span id="speaker"></span><div class="mid"><span id="prev"></span><span id="play"></span><span id="next"></span></div><span id="volume"></span></div><div class="bottom"><div class="icons" id="icons"></div><div class="stats" id="stats"></div></div><p class="notice">Static preview · audio playback disabled</p></div><div class="right"><div id="tracks" class="tracks"></div></div></div></div><script>
// All records here are illustrative demo metadata, not exported from a private library.
const albums=[
{title:'Beethoven · String Quartets',composer:'Ludwig van Beethoven',artist:'Sample String Quartet',bg:'#e5e5dd',fg:'#6b6a60',label:'BEETHOVEN',sub:'STRING QUARTETS',tracks:['Allegro','Adagio','Scherzo','Finale','Andante','Allegretto','Presto','Lento','Menuetto','Finale: Allegro']},
{title:'Mozart · Serenades',composer:'Wolfgang Amadeus Mozart',artist:'Demo Chamber Orchestra',bg:'#dae0dd',fg:'#506b66',label:'MOZART',sub:'SERENADES',tracks:['Allegro','Romanze','Menuetto','Rondo','Marcia','Andante','Allegro','Adagio','Presto']},
{title:'Bach · Orchestral Suites',composer:'Johann Sebastian Bach',artist:'Demo Baroque Ensemble',bg:'#e5ddce',fg:'#7b644a',label:'BACH',sub:'ORCHESTRAL SUITES',tracks:['Ouverture','Courante','Gavotte','Forlane','Menuet','Bourrée','Passepied','Badinerie']},
{title:'Dvořák · Violin Concerto',composer:'Antonín Dvořák',artist:'Demo Soloist & Orchestra',bg:'#d9dce6',fg:'#606780',label:'DVOŘÁK',sub:'VIOLIN CONCERTO',tracks:['Allegro ma non troppo','Adagio ma non troppo','Finale: Allegro giocoso','Romance','Fantasy']},
{title:'Mahler · Orchestral Songs',composer:'Gustav Mahler',artist:'Demo Vocal Ensemble',bg:'#e7dce0',fg:'#805e6e',label:'MAHLER',sub:'ORCHESTRAL SONGS',tracks:['Introduction','Lieder I','Lieder II','Lieder III','Intermezzo','Lieder IV','Lieder V','Finale']},
{title:'Sibelius · Symphonies',composer:'Jean Sibelius',artist:'Demo Symphony Orchestra',bg:'#d8e2e7',fg:'#496a7c',label:'SIBELIUS',sub:'SYMPHONIES',tracks:['Tempo molto moderato','Allegro molto vivace','Il tempo largo','Allegro','Andante','Vivacissimo','Finale']},
{title:'Brahms · Chamber Works',composer:'Johannes Brahms',artist:'Demo Chamber Players',bg:'#e3d8cd',fg:'#775f4f',label:'BRAHMS',sub:'CHAMBER WORKS',tracks:['Allegro non troppo','Andante','Scherzo','Rondo','Intermezzo','Finale']},
{title:'Ravel · Orchestral Music',composer:'Maurice Ravel',artist:'Demo Philharmonic Orchestra',bg:'#dcdce6',fg:'#666483',label:'RAVEL',sub:'ORCHESTRAL MUSIC',tracks:['Prélude','Moderato','Allegro','Menuet','Finale','Epilogue']}
];
const svg={speaker:'<svg viewBox="0 0 24 24"><rect x="4" y="6" width="7" height="12" rx="2"/><circle cx="7.5" cy="10" r="1"/><circle cx="7.5" cy="15" r="1"/></svg>',prev:'<svg viewBox="0 0 24 24"><path d="M6 5v14M19 5 8 12l11 7z"/></svg>',play:'<svg viewBox="0 0 24 24"><path d="m7 4 13 8-13 8z"/></svg>',next:'<svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l11 7-11 7z"/></svg>',volume:'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM17 9c2 2 2 4 0 6M20 6c4 4 4 8 0 12"/></svg>',heart:'<svg viewBox="0 0 24 24"><path d="M12 21 4 13a5 5 0 0 1 7-7l1 1 1-1a5 5 0 0 1 7 7z"/></svg>',image:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="m4 18 6-6 3 3 3-3 4 4"/></svg>',folder:'<svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h5l3 3h6a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>'};
function cover(a){return `<div class="art">${a.label}<span>${a.sub}</span></div>`}
function show(list){grid.innerHTML='';list.forEach(a=>{const b=document.createElement('button');b.className='album';b.innerHTML=`<div class="cover" style="--bg:${a.bg};--fg:${a.fg}">${cover(a)}</div><div class="album-title"></div><div class="album-artist"></div>`;b.querySelector('.album-title').textContent=a.title;b.querySelector('.album-artist').textContent=a.artist;b.onclick=()=>openAlbum(a);grid.append(b)});count.textContent=list.length+' sample albums'}
function openAlbum(a){const c=document.getElementById('modalCover');c.style.setProperty('--bg',a.bg);c.style.setProperty('--fg',a.fg);c.innerHTML=cover(a);headline.textContent=a.title;performer.textContent=a.composer+' · '+a.artist;tracks.innerHTML='';a.tracks.forEach((t,i)=>{let e=document.createElement('div');e.className='track';e.innerHTML='<span class="num"></span><span class="trackname"></span><span class="duration">--:--</span>';e.querySelector('.num').textContent=String(i+1).padStart(2,'0');e.querySelector('.trackname').textContent=t;tracks.append(e)});stats.innerHTML='<span><b>Length</b> —</span><span><b>Format</b> —</span>';modal.classList.add('open')}
for(const k of ['speaker','prev','play','next','volume'])document.getElementById(k).innerHTML=svg[k];icons.innerHTML=svg.heart+svg.image+svg.folder;close.onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)close.click()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close.click()});q.oninput=()=>show(albums.filter(a=>(a.title+' '+a.composer+' '+a.artist).toLowerCase().includes(q.value.toLowerCase())));show(albums);
</script></body></html>
